<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Pesquisa | WDD 130</title>
</head>
<body>

  <header>
    <h1>Formulário de Pesquisa</h1>
  </header>

  <main>
    <form action="#" method="post">
      
      <label for="nome-completo">Nome Completo:</label>
      <input type="text" id="nome-completo" name="nome-completo" required>


      <label for="email-do-usuario">E-mail:</label>
      <input type="email" id="email-do-usuario" name="email-do-usuario" required>

      <label for="navegador">Qual é o seu navegador de internet favorito?</label>
      <select id="navegador" name="navegador">
        <option value="" disabled selected>Escolha uma opção...</option>
        <option value="chrome">Chrome</option>
        <option value="firefox">Firefox</option>
        <option value="edge">Edge</option>
        <option value="brave">Brave</option>
        <option value="other">Outro</option>
      </select>

      <label for="pet">Você tem um bichinho de estimação?</label>
      <input type="checkbox" id="pet" name="pet">


      <label for="feedback">Liste os lugares onde você morou:</label>
      <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Flórida, Amsterdã Holanda, Timbuktu Mali"></textarea>

      <button type="submit">Enviar Enquete</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 | Formulário HTML - Atividade de Enquete do Usuario | Wenndel Frade</p>
  </footer>

</body>
</html>
