<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela de Times e Ligas</title>
  <link rel="stylesheet" href="estilos/tabela.css">
</head>
<body>

  <table>
    <caption></caption>
    <thead>
      <tr>
        <th scope="col">Liga</th>
        <th scope="col">Time</th>
        <th scope="col">Retrospecto (vitórias–derrotas)</th>
        <th scope="col">Número de Jogadores</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th rowspan="2" scope="rowgroup">Sul</th>
        <td>Paraná</td>
        <td>52-19</td>
        <td>23</td>
      </tr>
      <tr>
        <td>Santa Catarina</td>
        <td>49-24</td>
        <td>10</td>
      </tr>
      <tr>
        <th rowspan="3" scope="rowgroup">Oeste</th>
        <td>Lacerda</td>
        <td>92-70</td>
        <td>27</td>
      </tr>
      <tr>
        <td>Acre</td>
        <td>75-87</td>
        <td>20</td>
      </tr>
      <tr>
        <td>Rondônia</td>
        <td>10-7</td>
        <td>12</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <th colspan="3" scope="row">Total de Jogadores</th>
        <td>92</td>
      </tr>
    </tfoot>
  </table>

</body>
</html>
