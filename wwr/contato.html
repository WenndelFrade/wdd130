    <main>
        <h1>Adrena Rafting em corredeiras</h1>
        <div class="informacoes-contato">
        <h3>123 Rua Principal do Rio</h3>
        <h3>Foz do Iguaçu, Parana</h3>
        <h3>+55 45 99999-9999</h3>
        <h3>info@correiras.com</h3>
        </div>
        <div class="mapa-informacoes">
            <div class="mapa">

                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d11359.993867641992!2d-47.92987965008092!3d-18.1665307060016!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1791071248922!5m2!1spt-BR!2sbr" width="600" height="450";
                allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        <form action="">
            <label for="q1">Nome</label>
            <input type="text" name="q1" id="q1">
            <label for="q2">Email</label>
            <input type="text" name="q2" id="q2">
            <label class="rotulo-lateral">Propósito da Mensagem</label>
            <div class="proposito-mensagem">
                <label><input type="radio" id="opcao1" name="proposito" value="duvida"> Dúvida Geral</label>
                <label><input type="radio" id="opcao2" name="proposito" value="reserva"> Pergunta sobre Reserva</label>
                <label><input type="radio" id="opcao3" name="proposito" value="sugestao"> Sugestão</label>
            </div>
            <label for="q3" class="label-mensagem">Mensagem</label>
            <textarea name="q3" id="q3" placeholder="Digite aqui"></textarea>
            <label for="q4" class="label-full checkbox-newsletter"></label>
            <input type="checkbox" id="q4" name="q4"> Por favor, me inscreva na newsletter mensal
            <button type="submit"> Entrar em Contato!</button>
        </form>
        </div>

        <section class="funcionarios-escritorio">
            <h2>Estamos aqui para servi-lo</h2>
            <div class="perfil-funcionarios">
            <figure>
                <img src="imagens/funcionario1.jpg" alt="Assistente de Marketing">
                <figcaption>Analista Financeiro e Administrativo</figcaption>
            </figure>

            <figure>
                <img src="imagens/funcionario2.jpg" alt="Especialista em Marketing">
                <figcaption>Especialista em Marketing e Vendas</figcaption>
            </figure>

            <figure>
                <img src="imagens/funcionario3.jpg" alt="Gerente de Operações">

            </figure>
